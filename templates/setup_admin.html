{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 520px; margin: 40px auto;">
    <h2>Initial Admin Setup</h2>
    <p style="font-size:13px; color:var(--muted); margin-top:4px;">
        No admin user found. Create the first administrator account for Nexivo RMM.
    </p>

    {% if error %}
        <div class="error" style="margin-top:10px;">{{ error }}</div>
    {% endif %}

    <form method="post" action="/setup-admin" style="margin-top:12px;">
        <div class="form-field">
            <label for="email">Admin Email</label>
            <input id="email" name="email" required type="email" value="{{ email or '' }}">
        </div>
        <div class="form-field">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required>
        </div>
        <div class="form-field">
            <label for="password_confirm">Confirm Password</label>
            <input id="password_confirm" name="password_confirm" type="password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Create Admin</button>
            <a href="/login" class="btn">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
