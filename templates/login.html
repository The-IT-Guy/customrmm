<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <title>Nexivo RMM – Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        :root {
            --bg: #020617;
            --bg-card: rgba(2, 6, 23, 0.9);
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.12);
            --border-subtle: rgba(148, 163, 184, 0.35);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --danger: #fb7185;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: system-ui, -apple-system, Segoe UI, sans-serif;
            background: radial-gradient(circle at top left, #0f172a 0, #020617 45%, #000 100%);
            color: var(--text);
        }

        .login-box {
            width: 360px;
            background: linear-gradient(145deg, rgba(15,23,42,.92), rgba(2,6,23,.97));
            border: 1px solid var(--border-subtle);
            border-radius: 18px;
            padding: 28px 30px;
            box-shadow: 0 18px 40px rgba(0,0,0,.75);
            backdrop-filter: blur(8px);
            animation: fadeIn .4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
            font-size: 18px;
            letter-spacing: .04em;
        }

        .error {
            background: rgba(251,113,133,0.15);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 14px;
            font-size: 13px;
            text-align: center;
        }

        .form-field {
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
        }

        .form-field label {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
            letter-spacing: .03em;
        }

        .form-field input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            background: rgba(15,23,42,0.9);
            border: 1px solid var(--border-subtle);
            color: var(--text);
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 999px;
            margin-top: 8px;
            background: var(--accent-soft);
            border: 1px solid var(--accent);
            color: var(--text);
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background .2s;
        }

        button:hover {
            background: rgba(34,197,94,0.2);
        }

        .hint {
            margin-top: 12px;
            text-align: center;
            font-size: 12px;
            color: var(--muted);
        }
    </style>
</head>

<body>
<div class="login-box">

    <h2>Nexivo RMM Login</h2>

    {% if error %}
    <div class="error">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login">
        <div class="form-field">
            <label for="email">Email</label>
            <input type="text" id="email" name="email" required value="admin@local" />
        </div>

        <div class="form-field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required value="admin123" />
        </div>

        <button type="submit">Log In</button>
    </form>

    <div class="hint">
        Default login: <br> <strong>admin@local / admin123</strong>
    </div>

</div>
</body>
</html>
