{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 480px; margin: 40px auto;">
    <h2>Forgot Password</h2>
    <p style="font-size:13px; color:var(--muted); margin-top:4px;">
        Enter your admin email. If an account exists, a reset link or token will be generated.
    </p>

    {% if message %}
        <div class="error" style="margin-top:10px; background:rgba(34,197,94,0.12); border-color:var(--accent); color:var(--accent);">
            {{ message }}
        </div>
    {% endif %}

    <form method="post" action="/forgot-password" style="margin-top:12px;">
        <div class="form-field">
            <label for="email">Admin Email</label>
            <input id="email" name="email" required type="email" value="{{ email or '' }}">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn">Send Reset Link</button>
            <a href="/login" class="btn">Back to Login</a>
        </div>
    </form>
</div>
{% endblock %}
