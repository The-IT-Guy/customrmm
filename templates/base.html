<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8" />
    <title>Nexivo RMM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        :root {
            --bg: #020617;
            --bg-card: #020617;
            --accent: #22c55e;
            --accent-soft: rgba(34, 197, 94, 0.11);
            --border-subtle: rgba(148, 163, 184, 0.4);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --danger: #fb7185;
        }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top left, #0f172a 0, #020617 45%, #000 100%);
            color: var(--text);
        }
        a { color: var(--accent); text-decoration: none; }
        a:hover { text-decoration: underline; }
        header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo {
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-size: 14px;
        }
        .chip {
            border-radius: 999px;
            padding: 4px 10px;
            border: 1px solid var(--border-subtle);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
        }
        main {
            max-width: 1200px;
            margin: 24px auto 40px;
            padding: 0 16px;
        }
        .grid {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
            gap: 16px;
        }
        .card {
            background: linear-gradient(145deg, rgba(15,23,42,.9), rgba(2,6,23,.98));
            border-radius: 18px;
            border: 1px solid var(--border-subtle);
            padding: 16px 18px;
            box-shadow: 0 18px 40px rgba(0,0,0,.75);
        }
        .card h2 {
            margin: 0 0 8px;
            font-size: 16px;
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            padding: 6px 4px;
            border-bottom: 1px solid rgba(30,41,59,0.8);
        }
        th {
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: var(--muted);
        }
        .btn {
            border-radius: 999px;
            border: 1px solid var(--accent);
            background: var(--accent-soft);
            color: var(--text);
            padding: 4px 10px;
            font-size: 12px;
            text-decoration: none;
        }
        .btn.danger {
            border-color: var(--danger);
            color: var(--danger);
        }
        .status-pill {
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 10px;
            letter-spacing: .08em;
            text-transform: uppercase;
        }
        .status-online {
            background: rgba(34,197,94,0.14);
            color: #4ade80;
        }
        .status-offline {
            background: rgba(148,163,184,0.15);
            color: var(--muted);
        }
        form.inline {
            display: inline;
            margin: 0;
        }
        .form-field {
            display: flex;
            flex-direction: column;
            margin-bottom: 10px;
            font-size: 13px;
        }
        .form-field label {
            margin-bottom: 4px;
            color: var(--muted);
        }
        .form-field input,
        .form-field textarea,
        .form-field select {
            border-radius: 10px;
            border: 1px solid var(--border-subtle);
            padding: 6px 8px;
            background: rgba(15,23,42,0.9);
            color: var(--text);
        }
        .form-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        @media (max-width: 900px) {
            .grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>
<body>
<header>
    <div class="logo">NEXIVO RMM</div>
    <div class="chip">Dashboard</div>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
