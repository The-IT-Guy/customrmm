cat > /opt/customrmm/server/templates/dashboard.html << 'EOF'
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nexivo RMM – Dashboard</title>
  <link rel="stylesheet" href="/static/nexivo.css">
</head>
<body>
  <div class="dashboard">
    <div class="header">
      <h1>Device Overview</h1>
      <span class="subtitle">Nexivo RMM</span>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>Hostname</th>
            <th>OS</th>
            <th>IP</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody>
          {% for host, os, ip, last_seen in agents %}
          <tr>
            <td>{{ host }}</td>
            <td>{{ os }}</td>
            <td>{{ ip }}</td>
            <td>
              {% if now - last_seen < 120 %}
                <span class="status-online">Online</span>
              {% else %}
                <span class="status-offline">Offline</span>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
EOF
