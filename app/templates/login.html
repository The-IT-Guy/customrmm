{% extends "_layout.html" %}
{% block content %}
  <div class="grid" style="place-items:center; min-height:70vh;">
    <div class="card" style="max-width:520px; width:100%;">
      <div class="h1">Login</div>
      <div class="help">Use your admin account. If TOTP is enabled, enter the 6-digit code.</div>
      {% if error %}<div class="error" style="margin-top:12px;">{{ error }}</div>{% endif %}
      <form method="post" action="/login" style="margin-top:14px;">
        <div class="row">
          <div class="col">
            <label class="help">Email</label>
            <input class="input" name="email" type="email" required />
          </div>
        </div>
        <div class="row" style="margin-top:12px;">
          <div class="col">
            <label class="help">Password</label>
            <input class="input" name="password" type="password" required />
          </div>
        </div>
        <div class="row" style="margin-top:12px;">
          <div class="col">
            <label class="help">TOTP (optional)</label>
            <input class="input" name="totp_code" type="text" inputmode="numeric" pattern="[0-9]{6}" placeholder="123456" />
          </div>
        </div>
        <div class="row" style="margin-top:14px;">
          <button class="btn primary" type="submit" style="width:100%;">Sign in</button>
        </div>
      </form>
      <div class="help" style="margin-top:12px;">If this is a brand-new install, go to <span class="code">/setup-admin</span>.</div>
    </div>
  </div>
{% endblock %}
